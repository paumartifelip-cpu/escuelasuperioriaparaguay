<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESIA Paraguay · Escuela</title>
  <meta name="theme-color" content="#242527">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/redirect.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Guardia de acceso: sin sesión, vuelve a la portada antes de pintar nada.
    if (!EsiaAuth.isLoggedIn()) { window.location.replace('index.html'); }
  </script>
</head>
<body class="school-page">
  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-btn" class="icon-btn" aria-label="Menú" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <a href="#/" class="brand" aria-label="Inicio">
        <img class="brand-logo" src="assets/logo.png" alt="" width="32" height="32">
        <span class="brand-text">ESIA <small>Paraguay</small></span>
      </a>
    </div>

    <form id="search-form" class="search" role="search">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <input id="search" type="search" placeholder="Buscar lecciones" aria-label="Buscar lecciones" autocomplete="off" enterkeyhint="search">
      <button type="button" id="search-clear" class="search-clear" aria-label="Borrar búsqueda">×</button>
    </form>

    <div class="topbar-right">
      <button id="theme-btn" class="switch" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro"><span class="switch-knob" aria-hidden="true"></span></button>
      <button id="logout-btn" class="btn btn-ghost" type="button">Salir</button>
    </div>
  </header>

  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegación"></aside>
    <div id="backdrop" class="backdrop" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <noscript><p class="noscript">Esta plataforma necesita JavaScript.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
